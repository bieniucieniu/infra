apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: zula
  labels:
    app.kubernetes.io/name: zula-backend
    app.kubernetes.io/part-of: zula
data:
  APP_URL: https://zula.kurwidolek.com
  DATABASE_JDBC_URL: jdbc:postgresql://zula-pg-rw:5432/zula
  DATABASE_MAX_POOL_SIZE: "10"
  AUTO_MIGRATE: "true"
  S3_ENABLED: "true"
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: zula
  S3_REGION: us-east-1
  JWT_AUDIENCE: zula
  JWT_REALM: Zula
  JWT_AUTO_GENERATE_KEY: "true"
  JWT_SIGNING_ENABLED: "true"
  JWT_KEY_ID: default
  JWT_ACCESS_TOKEN_TTL_SECONDS: "900"
  JWT_REFRESH_TOKEN_TTL_SECONDS: "2592000"
  JWT_K8S_ENABLED: "true"
  JWT_K8S_SECRET_NAME: zula-jwt-keys
  JWT_K8S_AUTO_PULL: "true"
  JWT_K8S_AUTO_PUSH: "true"
  AUTH_COOKIE_SECURE: "true"
  AUTH_REQUIRE_PROVIDER_REFRESH_ON_LOGIN: "true"
  AUTH_PROVIDER_CHECK_INTERVAL_SECONDS: "21600"
  AUTH_APPLE_CODE_FLOW_ENABLED: "false"
  JOBRUNR_DASHBOARD: "false"
