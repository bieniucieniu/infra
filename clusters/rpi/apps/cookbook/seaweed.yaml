apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: cookbook
  namespace: cookbook
  labels:
    app.kubernetes.io/part-of: cookbook
spec:
  seaweedRef:
    name: seaweed
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: cookbook
  namespace: cookbook
  labels:
    app.kubernetes.io/part-of: cookbook
spec:
  seaweedRef:
    name: seaweed
    namespace: seaweedfs
  identityRef:
    name: cookbook
  secretRef:
    name: cookbook-s3
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: cookbook
  namespace: cookbook
  labels:
    app.kubernetes.io/part-of: cookbook
spec:
  seaweedRef:
    name: seaweed
    namespace: seaweedfs
  statements:
    - effect: Allow
      actions:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
        - s3:ListBucket
      resources:
        - cookbook
        - cookbook/*
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3PolicyBinding
metadata:
  name: cookbook
  namespace: cookbook
  labels:
    app.kubernetes.io/part-of: cookbook
spec:
  seaweedRef:
    name: seaweed
    namespace: seaweedfs
  policyRef:
    name: cookbook
  subjects:
    - kind: S3Identity
      name: cookbook
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: cookbook
  namespace: cookbook
  labels:
    app.kubernetes.io/part-of: cookbook
spec:
  name: cookbook
  owner: cookbook
  clusterRef:
    name: seaweed
    namespace: seaweedfs
