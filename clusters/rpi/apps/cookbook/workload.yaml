apiVersion: v1
kind: Namespace
metadata:
  name: cookbook
  labels:
    app.kubernetes.io/name: cookbook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cookbook
  namespace: cookbook
  labels:
    app.kubernetes.io/name: cookbook
    app.kubernetes.io/part-of: cookbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cookbook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cookbook
        app.kubernetes.io/part-of: cookbook
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: cookbook
          image: ghcr.io/bieniucieniu/cookbook:latest@sha256:9d14b1bc2093a6470c9150b3178cf2a84b63cf11c27f5aa6fe34df943e2c93dc # {"$imagepolicy": "flux-system:cookbook"}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: postgresql://cookbook-rw.cookbook.svc:5432/cookbook
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: cookbook-app
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cookbook-app
                  key: password
            - name: DATABASE_MAX_POOL_SIZE
              value: "5"
            - name: S3_ENDPOINT
              value: http://seaweed-s3.cookbook.svc:8333
            - name: S3_BUCKET
              value: cookbook
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cookbook-s3
                  key: accessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cookbook-s3
                  key: secretKey
            - name: WORKOS_REDIRECT_URI
              value: https://cookbook.kurwidolek.com/api/auth/callback
            - name: WORKOS_LOGOUT_RETURN_TO
              value: https://cookbook.kurwidolek.com/
            - name: WORKOS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cookbook-auth
                  key: WORKOS_CLIENT_ID
                  optional: true
            - name: WORKOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cookbook-auth
                  key: WORKOS_API_KEY
                  optional: true
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cookbook-auth
                  key: AGENT_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cookbook
  namespace: cookbook
  labels:
    app.kubernetes.io/name: cookbook
    app.kubernetes.io/part-of: cookbook
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cookbook
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cookbook-web
  namespace: cookbook
  labels:
    app.kubernetes.io/name: cookbook-web
    app.kubernetes.io/part-of: cookbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cookbook-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cookbook-web
        app.kubernetes.io/part-of: cookbook
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: cookbook-web
          image: ghcr.io/bieniucieniu/cookbook/web:latest@sha256:1c77fc2276e33daf4d84d46b98a58fc46f8fce11ab941ccf0d8157fc7f9627d8 # {"$imagepolicy": "flux-system:cookbook-web"}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cookbook-web
  namespace: cookbook
  labels:
    app.kubernetes.io/name: cookbook-web
    app.kubernetes.io/part-of: cookbook
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cookbook-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
