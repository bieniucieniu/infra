apiVersion: v1
kind: Namespace
metadata:
  name: solid-kit
  labels:
    app.kubernetes.io/name: solid-kit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solid-kit
  namespace: solid-kit
  labels:
    app.kubernetes.io/name: solid-kit
    app.kubernetes.io/part-of: solid-kit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: solid-kit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solid-kit
        app.kubernetes.io/part-of: solid-kit
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: solid-kit
          image: ghcr.io/bieniucieniu/solid-kit/web:latest@sha256:e067cee9df99b79aecee507e72e180542ada3d6753cb53aae300aff9e8c23a2b # {"$imagepolicy": "flux-system:solid-kit"}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: solid-kit
  namespace: solid-kit
  labels:
    app.kubernetes.io/name: solid-kit
    app.kubernetes.io/part-of: solid-kit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: solid-kit
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
