apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: solid-kit
  namespace: solid-kit
  labels:
    app.kubernetes.io/name: solid-kit
    app.kubernetes.io/part-of: solid-kit
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: web
  hostnames:
    - solid-kit.kurwidolek.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: solid-kit
          port: 8080
