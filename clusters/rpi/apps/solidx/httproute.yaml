apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: solidx
  namespace: solidx
  labels:
    app.kubernetes.io/name: solidx
    app.kubernetes.io/part-of: solidx
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: web
  hostnames:
    - solidx.kurwidolek.com
    # The old name keeps working until DNS and the tunnel point only at solidx.
    - solid-kit.kurwidolek.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: solidx
          port: 8080
