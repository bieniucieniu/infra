apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-operator
  namespace: postgres-operator
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: postgres-operator
      version: "1.15.1"
      sourceRef:
        kind: HelmRepository
        name: postgres-operator
        namespace: flux-system
      interval: 12h
  releaseName: postgres-operator
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # ghcr multi-arch (amd64 + arm64) — required on rpi
    image:
      registry: ghcr.io
      repository: zalando/postgres-operator
      tag: v1.15.1
    configGeneral:
      enable_crd_registration: true
      # Spilo 18 multi-arch
      docker_image: ghcr.io/zalando/spilo-18:4.1-p1
    configKubernetes:
      watched_namespace: "*"
      enable_pod_antiaffinity: false
    configLoadBalancer:
      enable_master_load_balancer: false
      enable_replica_load_balancer: false
    configTeamsApi:
      enable_teams_api: false
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 500Mi
