apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cookbook
  namespace: cookbook
  labels:
    app.kubernetes.io/name: cookbook
    app.kubernetes.io/part-of: cookbook
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: web
  hostnames:
    - cookbook.kurwidolek.com
  rules:
    # The API serves everything under /api/v1 itself, so paths pass through unchanged.
    # OAuth discovery for the MCP endpoint lives at the host root (RFC 8414 / RFC 9728).
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server
      backendRefs:
        - name: cookbook
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cookbook-web
          port: 8080
