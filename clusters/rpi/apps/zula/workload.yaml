apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: zula
  labels:
    app.kubernetes.io/name: zula-backend
    app.kubernetes.io/part-of: zula
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zula-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zula-backend
        app.kubernetes.io/part-of: zula
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PG_HOST
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PG_USER
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h "$PGHOST" -U "$PGUSER"; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: backend
          image: ghcr.io/bieniucieniu/zula/backend:latest@sha256:8949a215b769aaaeb1ff4b727cc14b3284b67f5f26150ed7c5d1db4fdca3eb3c # {"$imagepolicy": "flux-system:zula-backend"}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: zula
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: zula
  labels:
    app.kubernetes.io/name: zula-backend
    app.kubernetes.io/part-of: zula
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zula-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
