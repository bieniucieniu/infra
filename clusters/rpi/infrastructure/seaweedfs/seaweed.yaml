apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed
  namespace: seaweedfs
  labels:
    app.kubernetes.io/name: seaweed
spec:
  image: chrislusf/seaweedfs:4.51
  volumeServerDiskCount: 1
  master:
    replicas: 1
    volumeSizeLimitMB: 256
    defaultReplication: "000"
    persistence:
      enabled: true
      resources:
        requests:
          storage: 256Mi
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 192Mi
  volume:
    replicas: 1
    requests:
      storage: 2Gi
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  filer:
    replicas: 1
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"
    persistence:
      enabled: true
      resources:
        requests:
          storage: 1Gi
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  s3:
    replicas: 1
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
