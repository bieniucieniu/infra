apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
  namespace: seaweedfs-operator
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: seaweedfs-operator
      version: "0.1.42"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator
        namespace: flux-system
      interval: 12h
  releaseName: seaweedfs-operator
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    replicaCount: 1
    csiDriver:
      enabled: false
    grafanaDashboard:
      enabled: false
    crds:
      create: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
