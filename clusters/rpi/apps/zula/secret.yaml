# Replace placeholder values before first deploy (or patch on-cluster).
# Keys mirror devenv.nix / secretspec env vars.
apiVersion: v1
kind: Secret
metadata:
  name: zula
  namespace: zula
  labels:
    app.kubernetes.io/name: zula
    app.kubernetes.io/part-of: zula
type: Opaque
stringData:
  PG_USER: postgres
  PG_PASSWORD: postgres
  PG_DATABASE: zula_dev
  S3_BUCKET: zula-dev
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio123
  JWT_SECRET: change-me-jwt-secret
  GOOGLE_CLIENT_ID: replace-me
  GOOGLE_CLIENT_SECRET: replace-me
