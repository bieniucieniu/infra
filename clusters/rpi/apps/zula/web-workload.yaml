apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: zula
  labels:
    app.kubernetes.io/name: zula-web
    app.kubernetes.io/part-of: zula
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zula-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zula-web
        app.kubernetes.io/part-of: zula
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: web
          image: ghcr.io/bieniucieniu/zula/web:latest@sha256:2eda79894d94a7752192e5056a3129c4a8b680f8e0b90e25112c06f667f76a1f # {"$imagepolicy": "flux-system:zula-web"}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: zula
  labels:
    app.kubernetes.io/name: zula-web
    app.kubernetes.io/part-of: zula
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zula-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
