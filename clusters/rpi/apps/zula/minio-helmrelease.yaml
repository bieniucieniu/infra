apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: zula
  labels:
    app.kubernetes.io/name: zula-minio
    app.kubernetes.io/part-of: zula
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: minio
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 12h
  releaseName: minio
  values:
    global:
      security:
        allowInsecureImages: true
    fullnameOverride: minio
    mode: standalone
    image:
      registry: docker.io
      repository: bitnamilegacy/minio
      tag: 2025.7.23-debian-12-r5
    auth:
      existingSecret: zula
      rootUserSecretKey: S3_ACCESS_KEY
      rootPasswordSecretKey: S3_SECRET_KEY
    defaultBuckets: zula-dev
    console:
      enabled: false
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    provisioning:
      enabled: false
