apiVersion: v1
kind: Namespace
metadata:
  name: solidx
  labels:
    app.kubernetes.io/name: solidx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solidx
  namespace: solidx
  labels:
    app.kubernetes.io/name: solidx
    app.kubernetes.io/part-of: solidx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: solidx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solidx
        app.kubernetes.io/part-of: solidx
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: solidx
          image: ghcr.io/bieniucieniu/solidx/web:latest # {"$imagepolicy": "flux-system:solidx"}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: solidx
  namespace: solidx
  labels:
    app.kubernetes.io/name: solidx
    app.kubernetes.io/part-of: solidx
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: solidx
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
