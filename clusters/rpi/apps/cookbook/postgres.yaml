apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cookbook
  namespace: cookbook
  labels:
    app.kubernetes.io/name: cookbook
    app.kubernetes.io/part-of: cookbook
spec:
  instances: 1
  bootstrap:
    initdb:
      database: cookbook
      owner: cookbook
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
